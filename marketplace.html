<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypenex - Creator Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-['Inter']">

  <!-- Header / Navigation -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold text-slate-900 tracking-tight">HypeNex</a>
      <div class="flex items-center gap-6 text-sm font-medium">
        <a href="index.html" class="text-slate-600 hover:text-slate-900">Home</a>
        <a href="marketplace.html" class="text-indigo-600 font-semibold">Marketplace</a>
        <a href="signup.html" class="bg-slate-900 text-white px-4 py-2 rounded-lg hover:bg-slate-800 transition">Sign Up</a>
      </div>
    </div>
  </header>

  <!-- Marketplace Catalog Header -->
  <section class="max-w-7xl mx-auto px-6 pt-10 pb-6">
    <h1 class="text-3xl font-bold text-slate-900 mb-2">Creator Campaigns</h1>
    <p class="text-slate-600">Discover active brand opportunities and apply in seconds.</p>
  </section>

  <!-- Campaign Grid -->
  <main class="max-w-7xl mx-auto px-6 pb-20">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

      <!-- Campaign Card 1 -->
      <a href="campaign-detail.html" class="bg-white rounded-2xl border border-slate-200 overflow-hidden hover:shadow-md transition group">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-300">
        <div class="p-6">
          <div class="flex justify-between items-start mb-3">
            <h3 class="font-bold text-slate-900 text-lg group-hover:text-indigo-600 transition-colors">Spring '24 Running Series</h3>
            <img src="https://logo.clearbit.com/nike.com" class="w-8 h-8 rounded-full border">
          </div>
          <p class="text-sm text-slate-600 mb-4 line-clamp-2">Showcase authentic movement and daily running with the new Nike Air Zoom series.</p>
          <div class="flex justify-between items-center text-xs font-semibold pt-3 border-t border-slate-100">
            <span class="text-amber-600 font-bold">£1,250 + Perks</span>
            <span class="text-slate-500">TikTok / IG</span>
          </div>
        </div>
      </a>

    </div>
  </main>
</body>
</html>
